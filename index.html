<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>월간 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: 모바일 앱 같은 한 칼럼(최대 480px). 하단 탭 [목표 | 홈 | 지출내역], 우하단 + 버튼. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --surface-2: #E8ECEA;
  --fg: #17201E;
  --muted: #5F6C69;
  --line: #D9E0DD;
  --accent: #24557A;
  --accent-fg: #FFFFFF;
  --ok: #2E9E6B;
  --warn: #E3A82B;
  --danger: #D9473F;
  --over: #FFFFFF;
  --over-edge: #7B8885;
  --track: #DCE3E0;
  --c1: #3E6FB0; --c2: #C2703D; --c3: #7A5AA6; --c4: #2A9D8F; --c5: #C75D7B; --c6: #8A8F3A; --c7: #5E7C8A; --c8: #B8913A;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --col: 480px;
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101615;
    --surface: #182120;
    --surface-2: #222D2B;
    --fg: #E8EFED;
    --muted: #94A4A0;
    --line: #2B3836;
    --accent: #6FA8D6;
    --accent-fg: #0E1A22;
    --ok: #4CC38A;
    --warn: #F0BD4A;
    --danger: #F0675F;
    --over: #FFFFFF;
    --over-edge: #FFFFFF;
    --track: #2A3634;
    --c1: #6FA3E0; --c2: #E08F5C; --c3: #A98AD6; --c4: #4CC3B2; --c5: #E58AA3; --c6: #B8BC5A; --c7: #8FAEBB; --c8: #D9B65E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101615;
  --surface: #182120;
  --surface-2: #222D2B;
  --fg: #E8EFED;
  --muted: #94A4A0;
  --line: #2B3836;
  --accent: #6FA8D6;
  --accent-fg: #0E1A22;
  --ok: #4CC38A;
  --warn: #F0BD4A;
  --danger: #F0675F;
  --over: #FFFFFF;
  --over-edge: #FFFFFF;
  --track: #2A3634;
  --c1: #6FA3E0; --c2: #E08F5C; --c3: #A98AD6; --c4: #4CC3B2; --c5: #E58AA3; --c6: #B8BC5A; --c7: #8FAEBB; --c8: #D9B65E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

#app { max-width: var(--col); margin: 0 auto; min-height: 100%; padding-bottom: calc(var(--tabbar-h) + 96px); }

/* header + month switcher */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 10px; }
.top h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.month { display: inline-flex; align-items: center; gap: 4px; }
.month button { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; color: var(--fg); font-size: 18px; line-height: 1; }
.month button:hover { background: var(--surface-2); }
.month .label { min-width: 104px; text-align: center; font-weight: 600; font-size: 16px; }

.stack { display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ring */
.ring-wrap { display: grid; place-items: center; padding: 6px 0 2px; }
.ring { position: relative; width: min(260px, 100%); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.ring .pct { font-family: var(--font-num); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
.ring .pct small { font-size: 20px; font-weight: 500; margin-left: 1px; }
.ring .sub { font-size: 13px; color: var(--muted); }
.ring .amt { font-size: 13px; }
.remain { margin-top: 10px; text-align: center; font-size: 14px; color: var(--muted); }
.remain b { color: var(--fg); font-weight: 600; }

/* progress rows */
.rows { display: flex; flex-direction: column; gap: 16px; }
.row .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; min-width: 0; }
.row .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .p { font-size: 13px; color: var(--muted); flex: none; }
.bar { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--ok); transition: width 0.4s ease; }
.bar > i.warn { background: var(--warn); }
.bar > i.danger { background: var(--danger); }
.bar > i.over { background: var(--over); box-shadow: inset 0 0 0 1.5px var(--over-edge); }
.bar > i.none { background: var(--muted); opacity: 0.5; }
.row .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 5px; font-size: 13px; color: var(--muted); }
.row .foot .num { color: var(--fg); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--over-edge); background: var(--over); color: #17201E; margin-left: 6px; vertical-align: 1px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.memo-view { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }

.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--muted); background: var(--surface); }
.notice button { flex: none; }

/* buttons + inputs */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 500; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.armed { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
.in { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea.in { resize: vertical; min-height: 110px; line-height: 1.55; }
.amt-in { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.suffix { position: relative; }
.suffix .in { padding-right: 34px; }
.suffix::after { content: "원"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

/* expense list */
.day { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 2px 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 13px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.item .s { grid-column: 1; font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.item .a { grid-column: 2; grid-row: 1 / span 2; font-weight: 500; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sum-line .big { font-size: 26px; font-weight: 600; }

/* goals */
.goal-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) auto; gap: 8px; align-items: center; }
.goal-row .in { padding: 9px 10px; font-size: 15px; }
.x { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; line-height: 1; }
.x:hover { background: var(--surface-2); color: var(--danger); }
.goal-list { display: flex; flex-direction: column; gap: 8px; }
.add-row { display: flex; gap: 8px; margin-top: 12px; }
.add-row .in { padding: 9px 10px; font-size: 15px; }
.total-goal { display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 12px; color: var(--muted); }
.warnbox { font-size: 13px; color: var(--muted); }
.warnbox b { color: var(--warn); }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-right, 0px));
}
.tabbar .in-bar { max-width: var(--col); margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 500; border-radius: 12px; }
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--accent); font-weight: 600; }

.fab {
  position: fixed; z-index: 21;
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  right: max(16px, calc((100vw - var(--col)) / 2 + 0px), env(safe-area-inset-right, 0px));
  width: 56px; height: 56px; border-radius: 50%; border: 0;
  background: var(--accent); color: var(--accent-fg);
  font-size: 30px; line-height: 1; display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(0,0,0,0.22);
}
.fab:hover { filter: brightness(1.08); }
.fab[hidden] { display: none !important; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,13,0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: var(--col); background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92%; overflow-y: auto; }
.sheet h3 { margin: 0 0 14px; font-size: 17px; }
.sheet form { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 4px; }
.actions .right { display: flex; gap: 8px; margin-left: auto; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; max-width: calc(100% - 32px); }
.loading { padding: 80px 0; text-align: center; color: var(--muted); }

@media (max-width: 380px) {
  .goal-row { grid-template-columns: minmax(0, 1fr) auto; }
  .goal-row .in.amt-in { grid-column: 1; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* 점검 탭 */
.bar.big { height: 20px; }
.verdict { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 18px; font-weight: 600; line-height: 1.35; }
.verdict .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.kv b { font-weight: 600; flex: none; }
.kv.strong { font-size: 17px; }
.kv.branch { padding: 5px 0 5px 4px; font-size: 13px; color: var(--muted); border-bottom: 0; }
.kv.branch + .kv.branch { padding-top: 0; }
.tree { display: inline-block; width: 1.6em; font-family: var(--font-num); color: var(--muted); opacity: 0.8; }
.kv:last-child { border-bottom: 0; }
.sub-h { margin: 16px 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.idx { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px; border-radius: 6px; background: var(--surface-2); font-size: 12px; color: var(--muted); }
.ring.small-ring { width: min(220px, 100%); }
.share { margin-top: 12px; }
.lg { display: inline-flex; align-items: center; gap: 8px; }
.lg i { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.stars { display: flex; align-items: center; gap: 2px; }
.star { border: 0; background: transparent; font-size: 32px; line-height: 1; padding: 2px 4px; color: var(--track); border-radius: 8px; }
.star.on { color: var(--warn); }
.star:hover { transform: scale(1.08); }
#tab-review .field + .field, #tab-review .stars + .field { margin-top: 0; }
#tab-review section.card { display: flex; flex-direction: column; gap: 14px; }
#tab-review section.card > h2 { margin-bottom: 0; }
#tab-review section.card > .kv, #tab-review section.card > .sub-h { margin-block: 0; }

/* 로그인 */
.authwrap { max-width: 400px; margin: 0 auto; min-height: 100%; display: flex; align-items: center; padding-block: 40px; }
.authbox { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.brand { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.authform { display: flex; flex-direction: column; gap: 14px; }
.authbox .btn { padding: 12px 14px; font-size: 15px; }
.authlinks { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; }
.link { border: 0; background: transparent; color: var(--accent); font-size: 14px; padding: 6px 2px; text-decoration: underline; }
.amsg { min-height: 20px; font-size: 13px; color: var(--danger); overflow-wrap: anywhere; }
.amsg.ok { color: var(--ok); }
body.authing .tabbar, body.authing .fab { display: none; }

/* 마이 */
.me { display: flex; align-items: center; gap: 14px; min-width: 0; }
.avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 22px; font-weight: 600; text-transform: uppercase; }
.me .who { min-width: 0; }
.me .mail { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.me .via { font-size: 13px; color: var(--muted); }
.btn.wide { width: 100%; padding: 12px 14px; }

/* 카테고리 지출 팝업 */
.row.tap { cursor: pointer; border-radius: 12px; margin: -7px -9px; padding: 7px 9px; }
.row.tap:hover { background: var(--surface-2); }
.row.tap .chev { color: var(--muted); margin-left: 4px; font-size: 15px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-head h3 { margin: 0; overflow-wrap: anywhere; }
.catfoot { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.item.static { cursor: default; }
.item.static:hover { background: transparent; }
#catScrim .day:first-of-type { padding-top: 18px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="tabTitle">홈</h1>
    <div class="month" role="group" aria-label="월 선택">
      <button type="button" id="prevM" aria-label="이전 달">‹</button>
      <span class="label num" id="monthLabel"></span>
      <button type="button" id="nextM" aria-label="다음 달">›</button>
    </div>
  </header>

  <div id="loading" class="loading">불러오는 중…</div>

  <!-- 점검 -->
  <main id="tab-review" class="tab stack" hidden></main>
  <!-- 홈 -->
  <main id="tab-home" class="tab stack" hidden></main>
  <!-- 지출내역 -->
  <main id="tab-list" class="tab" hidden></main>
  <!-- 목표 설정 -->
  <main id="tab-goal" class="tab stack" hidden></main>
  <!-- 마이 -->
  <main id="tab-my" class="tab stack" hidden></main>
</div>

<button type="button" class="fab" id="fab" aria-label="지출 추가" hidden>+</button>

<nav class="tabbar" aria-label="메뉴">
  <div class="in-bar" role="tablist">
    <button type="button" role="tab" data-tab="review" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.8"/></svg>점검
    </button>
    <button type="button" role="tab" data-tab="goal" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg>목표
    </button>
    <button type="button" role="tab" data-tab="home" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3v9h9"/></svg>홈
    </button>
    <button type="button" role="tab" data-tab="list" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>지출내역
    </button>
    <button type="button" role="tab" data-tab="my" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg>마이
    </button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">지출 기록</h3>
    <form id="txForm" autocomplete="off">
      <div class="field">
        <label for="fDate">날짜</label>
        <input class="in" type="date" id="fDate" required>
      </div>
      <div class="two">
        <div class="field">
          <label for="fAcct">통장</label>
          <select class="in" id="fAcct" required></select>
        </div>
        <div class="field">
          <label for="fCat">카테고리</label>
          <select class="in" id="fCat" required></select>
        </div>
      </div>
      <div class="field">
        <label for="fAmt">금액</label>
        <div class="suffix"><input class="in amt-in" id="fAmt" inputmode="numeric" placeholder="0" required></div>
      </div>
      <div class="field">
        <label for="fNote">메모 (선택)</label>
        <input class="in" id="fNote" maxlength="60" placeholder="예: 점심, 지하철">
      </div>
      <div class="actions">

<script>
(function () {
'use strict';

};
var pad = function (n) { return (n < 10 ? '0' : '') + n; };
var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

/* ---------- state ---------- */
var S = {

  month: ymOf(new Date()),

  goals: {},          // goals[YYYY-MM] = {total, cats:{id:amt}, accts:{id:amt}, memo}

  ready: false, mode: 'local', db: null, uid: null

/* ---------- Firebase: 계정별 클라우드 저장 + 기기 간 실시간 동기화 ---------- */
var FB = { auth: null, fs: null, user: null, unsubSettings: null, unsubTx: {}, dirty: false, timer: null, seq: 0 };
var hooks = { remote: function () {} };

}

  try { FB.fs.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}

}
function userDoc() { return FB.fs.collection('users').doc(FB.user.uid); }
function settingsRef() { return userDoc().collection('data').doc('settings'); }
function txCol() { return userDoc().collection('tx'); }

async function getPreferServer(ref) {
  try { return await ref.get({ source: 'server' }); }

}
async function loadSettings() {
  var s = await getPreferServer(settingsRef());

}
function applySettings(d) {
  S.cats = d.cats || []; S.accts = d.accts || []; S.goals = d.goals || {}; S.reviews = d.reviews || {};
}
function settingsPayload() {
  return JSON.parse(JSON.stringify({ v: 1, cats: S.cats, accts: S.accts, goals: S.goals, reviews: S.reviews }));
}
function writeSettingsNow() {
  clearTimeout(FB.timer);
  var seq = ++FB.seq;

    if (FB.seq === seq) FB.dirty = false;
  }, function () {

}
function saveSettings() {

}
function flush() {

}

}

function txSet(item) {
  if (!FB.user) return Promise.resolve();
  var o = JSON.parse(JSON.stringify(item));
  o.month = o.date.slice(0, 7);

}
function txDel(id) {
  if (!FB.user) return Promise.resolve();
  return txCol().doc(id).delete().catch(function () { toast('삭제하지 못했어요. 연결을 확인해 주세요.'); });
}
function ensureMonth(m) {
  if (FB.unsubTx[m]) return FB.unsubTx[m].ready;

    if (first) { first = false; S.tx[m] = S.tx[m] || []; done(); }

}

}
// 이 기기에 저장돼 있던 예전(로그인 전) 데이터를 새 계정으로 옮김
function importLocal() {
  try {
    var raw = localStorage.getItem('gagyebu:settings');
    if (!raw) return false;
    applySettings(JSON.parse(raw));
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^gagyebu:tx-\d{4}-\d{2}$/.test(k)) {
        var items = (JSON.parse(localStorage.getItem(k)) || {}).items || [];

    }

  } catch (e) { return false; }
}
document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });

/* ---------- 첫 실행 예시 ---------- */
function seedDefaults() {
  var c = [['식비', 300000], ['쇼핑', 150000], ['교통비', 80000], ['문화/여가', 100000], ['기타', 70000]];
  var a = [['생활비 통장', 500000], ['용돈 통장', 200000]];
  S.cats = c.map(function (x) { return { id: uid(), name: x[0] }; });
  S.accts = a.map(function (x) { return { id: uid(), name: x[0] }; });
  var g = { total: 700000, cats: {}, accts: {}, memo: '' };
  S.cats.forEach(function (x, i) { g.cats[x.id] = c[i][1]; });
  S.accts.forEach(function (x, i) { g.accts[x.id] = a[i][1]; });
  S.goals[S.month] = g;
}
function seedSamples() {
  var now = new Date(), d = now.getDate();
  var C = S.cats, A = S.accts;
  var rows = [
    [0, C[0], A[0], 12000, '점심'], [1, C[0], A[0], 8500, '카페·간식'],
    [2, C[2], A[1], 1550, '지하철'], [3, C[1], A[0], 39000, '티셔츠'],
    [5, C[0], A[0], 14000, '저녁'], [6, C[3], A[1], 15000, '영화'],
    [8, C[2], A[1], 1550, '지하철']

  var items = rows.map(function (r) {
    var day = Math.max(1, d - r[0]);
    return { id: uid(), date: S.month + '-' + pad(day), cat: r[1].id, acct: r[2].id, amt: r[3], note: r[4], sample: true, ts: Date.now() + r[0] };
  });

  items.forEach(function (t) { txSet(t); });
}

/* ---------- goals ---------- */
function goalsFor(m) {

  if (keys.length) {
    var s = S.goals[keys[keys.length - 1]];
    return { total: s.total || 0, cats: Object.assign({}, s.cats), accts: Object.assign({}, s.accts), memo: '', inherited: true };
  }

}

}

/* ---------- sums + status ---------- */
function spentBy(m) {
  var out = { total: 0, cats: {}, accts: {} };
  (S.tx[m] || []).forEach(function (t) {
    out.total += t.amt;
    out.cats[t.cat] = (out.cats[t.cat] || 0) + t.amt;
    out.accts[t.acct] = (out.accts[t.acct] || 0) + t.amt;
  });

}
// 70% 미만 초록 / 70~90% 노랑 / 90~100% 빨강 / 100% 이상 흰색(초과)
function status(spent, goal) {

  return fallback;
}

window.GB = { $: $, esc: esc, pad: pad, ymd: ymd, ymOf: ymOf, uid: uid, won: won, numFmt: numFmt, parseAmt: parseAmt,

  fb: FB, fbInit: fbInit, hooks: hooks, loadSettings: loadSettings, applySettings: applySettings, watchSettings: watchSettings, importLocal: importLocal, stopAll: stopAll, flush: flush, txSet: txSet, txDel: txDel, saveSettings: saveSettings, ensureMonth: ensureMonth,

})();

(function () {
'use strict';

var RING_COLOR = { ok: 'var(--ok)', warn: 'var(--warn)', danger: 'var(--danger)', over: 'var(--over)', none: 'var(--muted)' };

function progressRow(name, spent, goal, thin, catId) {
  var st = G.status(spent, goal);
  var w = goal > 0 ? Math.min(100, st.ratio * 100) : 0;
  var pTxt = goal > 0 ? st.pct + '%' : '목표 없음';
  var badge = st.cls === 'over' ? '<span class="badge">초과</span>' : '';
  var open = catId ? '<div class="row tap" data-cat="' + esc(catId) + '" role="button" tabindex="0" aria-label="' + esc(name) + ' 지출 내역 보기">' : '<div class="row">';
  return open +
    '<div class="head"><span class="name">' + esc(name) + badge + '</span><span class="p num">' + pTxt + (catId ? '<span class="chev" aria-hidden="true">›</span>' : '') + '</span></div>' +
    '<div class="bar"' + (thin ? ' style="height:8px"' : '') + '><i class="' + st.cls + '" style="width:' + w.toFixed(1) + '%"></i></div>' +
    '<div class="foot"><span class="num">' + G.numFmt(spent) + '원</span><span class="num">' + (goal > 0 ? '목표 ' + G.numFmt(goal) + '원' : '목표를 설정해 보세요') + '</span></div>' +
    '</div>';
}

function ringSvg(st) {
  var R = 52, C = 2 * Math.PI * R;

    '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="var(--track)" stroke-width="12"/>';
  if (st.cls === 'over') {
    out += '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="var(--over-edge)" stroke-width="15"/>' +
           '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="var(--over)" stroke-width="12"/>';

    out += '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + RING_COLOR[st.cls] + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(2) + ' ' + C.toFixed(2) + '"/>';
  }

}

function hasSamples() {

}

function renderHome() {

    '<div class="amt num">' + G.numFmt(sp.total) + '원</div>' +

    '<div class="legend"><span><i style="background:var(--ok)"></i>70% 미만</span><span><i style="background:var(--warn)"></i>70~90%</span><span><i style="background:var(--danger)"></i>90~100%</span><span><i style="background:var(--over);box-shadow:inset 0 0 0 1.5px var(--over-edge)"></i>초과</span></div>' +
    '</section>';

  html += '<section class="card"><h2>카테고리별</h2><div class="hint" style="margin:-4px 0 14px">카테고리를 누르면 그 지출 내역만 볼 수 있어요</div><div class="rows">' +
    (S.cats.length ? S.cats.map(function (c) { return progressRow(c.name, sp.cats[c.id] || 0, g.cats[c.id] || 0, false, c.id); }).join('') : '<div class="muted small">목표 탭에서 카테고리를 추가해 보세요.</div>') +
    '</div></section>';

    (S.accts.length ? S.accts.map(function (a) { return progressRow(a.name, sp.accts[a.id] || 0, g.accts[a.id] || 0, true); }).join('') : '<div class="muted small">목표 탭에서 통장을 추가해 보세요.</div>') +
    '</div></section>';

  if (g.memo && g.memo.trim()) {
    html += '<section class="card"><h2>이번 달 메모</h2><div class="memo-view">' + esc(g.memo) + '</div></section>';

  $('#tab-home').innerHTML = html;
}

function renderList() {
  var m = S.month, items = (S.tx[m] || []).slice();

/* ---------- 카테고리별 지출 팝업 ---------- */
var catOpen = null, catFocus = null;
function catIsOpen() { return !!catOpen; }

      '<div class="suffix"><input class="in amt-in" id="ga-' + it.id + '" data-kind="' + kind + '" data-id="' + it.id + '" data-f="amt" inputmode="numeric" value="' + (v ? G.numFmt(v) : '') + '" placeholder="0" aria-label="목표 금액"></div>' +

function updateSums() {
  var g = G.goalsFor(S.month);

    var sum = list.reduce(function (s, x) { return s + (map[x.id] || 0); }, 0);

function fmtInput(inp) {

function addItem(kind) {
  var inp = $(kind === 'cat' ? '#newCat' : '#newAcct');

  if (!name) { G.toast('이름을 입력해 주세요'); inp.focus(); return; }
  var list = kind === 'cat' ? S.cats : S.accts;
  if (list.some(function (x) { return x.name === name; })) { G.toast('같은 이름이 이미 있어요'); return; }
  list.push({ id: G.uid(), name: name });
  G.saveSettings();
  renderGoal();
  var again = $(kind === 'cat' ? '#newCat' : '#newAcct'); if (again) again.focus();
}

var armTimer = null;
function deleteItem(btn) {
  var kind = btn.dataset.del, id = btn.dataset.id;
  var list = kind === 'cat' ? S.cats : S.accts;
  if (list.length <= 1) { G.toast('최소 1개는 남겨 두어야 해요'); return; }
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.textContent = '삭제?'; btn.style.cssText = 'width:auto;padding:0 8px;color:var(--danger);font-size:13px';
    clearTimeout(armTimer);
    armTimer = setTimeout(function () { renderGoal(); }, 3000);
    return;
  }
  var i = list.findIndex(function (x) { return x.id === id; });
  if (i >= 0) list.splice(i, 1);
  Object.keys(S.goals).forEach(function (m) {
    var mp = kind === 'cat' ? S.goals[m].cats : S.goals[m].accts; if (mp) delete mp[id];
  });
  G.saveSettings();
  renderGoal();
}

function bindGoal() {
  var root = $('#tab-goal');
  root.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'gTotal') {
      var g = G.editGoals(S.month); g.total = fmtInput(t); G.saveSettings(); updateSums(); return;
    }
    if (t.id === 'gMemo') { G.editGoals(S.month).memo = t.value; G.saveSettings(); return; }
    if (t.dataset && t.dataset.f === 'amt') {
      var n = fmtInput(t), gg = G.editGoals(S.month);
      (t.dataset.kind === 'cat' ? gg.cats : gg.accts)[t.dataset.id] = n;
      G.saveSettings(); updateSums(); return;
    }
    if (t.dataset && t.dataset.f === 'name') {
      var list = t.dataset.kind === 'cat' ? S.cats : S.accts;
      var it = list.find(function (x) { return x.id === t.dataset.id; });
      if (it) { it.name = t.value.trim() || it.name; G.saveSettings(); }
    }
  });
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'addCat') addItem('cat');
    else if (b.id === 'addAcct') addItem('acct');
    else if (b.dataset.del) deleteItem(b);
  });
  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'newCat') { e.preventDefault(); addItem('cat'); }
    if (e.target.id === 'newAcct') { e.preventDefault(); addItem('acct'); }
  });
}

function donut(items, total) {

  if (total > 0) {
    var acc = 0, gap = items.length > 1 ? 1.2 : 0;

function onLogoutClick(b) {
  if (b.dataset.armed !== '1') {
    b.dataset.armed = '1'; b.textContent = '정말 로그아웃'; b.classList.add('armed');
    clearTimeout(logoutTimer);
    logoutTimer = setTimeout(function () { b.dataset.armed = ''; b.textContent = '로그아웃'; b.classList.remove('armed'); }, 3000);
    return;
  }
  clearTimeout(logoutTimer);
  G.logout();
}
function typing() {
  var a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest('#app'));
}
// 다른 기기에서 바뀐 내용이 들어올 때: 입력 중이면 끝난 뒤에 화면 갱신
function renderSoon() {
  if (!S.ready) return;
  if (typing()) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', function () {
  if (!pendingRender) return;
  setTimeout(function () { if (!typing()) { pendingRender = false; render(); } }, 0);
});
G.hooks.remote = renderSoon;

function setTab(t) { S.tab = t; render(); window.scrollTo(0, 0); }
async function goMonth(m) {
  S.month = m;
  try { await G.ensureMonth(m); } catch (e) { G.toast('이 달 기록을 불러오지 못했어요'); S.tx[m] = S.tx[m] || []; }
  render();
}

/* ---------- 지출 입력창 ---------- */
function opts(list, selected, missingLabel) {
  var h = list.map(function (x) {
    return '<option value="' + esc(x.id) + '"' + (x.id === selected ? ' selected' : '') + '>' + esc(x.name) + '</option>';
  }).join('');
  if (selected && !list.some(function (x) { return x.id === selected; })) {
    h = '<option value="' + esc(selected) + '" selected>' + missingLabel + '</option>' + h;
  }
  return h;
}
function defaultDate() {
  var now = new Date();
  return G.ymOf(now) === S.month ? G.ymd(now) : S.month + '-01';
}
function openSheet(tx) {
  if (!S.cats.length || !S.accts.length) { G.toast('목표 탭에서 카테고리와 통장을 먼저 추가해 주세요'); return; }
  editing = tx ? { id: tx.id, month: tx.date.slice(0, 7), ts: tx.ts } : null;
  delArmed = false;
  $('#sheetTitle').textContent = tx ? '지출 수정' : '지출 기록';
  $('#fDate').value = tx ? tx.date : defaultDate();
  $('#fAcct').innerHTML = opts(S.accts, tx ? tx.acct : S.accts[0].id, '삭제된 통장');
  $('#fCat').innerHTML = opts(S.cats, tx ? tx.cat : S.cats[0].id, '삭제된 카테고리');
  $('#fAmt').value = tx ? G.numFmt(tx.amt) : '';
  $('#fNote').value = tx && tx.note ? tx.note : '';
  var del = $('#fDel'); del.hidden = !tx; del.textContent = '삭제'; del.classList.remove('armed');
  $('#scrim').hidden = false;
  setTimeout(function () { $('#fAmt').focus(); }, 30);
}
function closeSheet() { $('#scrim').hidden = true; editing = null; }

async function submitTx(e) {
  e.preventDefault();
  var date = $('#fDate').value, acct = $('#fAcct').value, cat = $('#fCat').value;
  var amt = G.parseAmt($('#fAmt').value), note = $('#fNote').value.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !amt || !acct || !cat) { G.toast('날짜와 금액을 확인해 주세요'); return; }
  var m = date.slice(0, 7);
  try { await G.ensureMonth(m); } catch (err) { G.toast('저장 위치를 불러오지 못했어요'); return; }
  var wasEditing = !!editing;
  var item = { id: editing ? editing.id : G.uid(), date: date, acct: acct, cat: cat, amt: amt, note: note, ts: editing && editing.ts ? editing.ts : Date.now() };
  if (editing) {
    var old = S.tx[editing.month] || [];
    var i = old.findIndex(function (t) { return t.id === editing.id; });
    if (i >= 0) old.splice(i, 1);
  }
  S.tx[m] = S.tx[m] || [];
  S.tx[m].push(item);
  G.txSet(item);          // 같은 id로 덮어쓰기: 달이 바뀌어도 한 건으로 유지
  closeSheet();
  S.month = m;
  render();
  G.toast(wasEditing ? '수정했어요' : '기록했어요');
}

function deleteTx() {
  var b = $('#fDel');
  if (!delArmed) { delArmed = true; b.textContent = '정말 삭제'; b.classList.add('armed'); return; }
  if (!editing) return;
  var arr = S.tx[editing.month] || [];
  var i = arr.findIndex(function (t) { return t.id === editing.id; });
  if (i >= 0) arr.splice(i, 1);
  G.txDel(editing.id);
  closeSheet(); render(); G.toast('삭제했어요');
}

function clearSamples() {
  Object.keys(S.tx).forEach(function (m) {
    S.tx[m].filter(function (t) { return t.sample; }).forEach(function (t) { G.txDel(t.id); });
    S.tx[m] = S.tx[m].filter(function (t) { return !t.sample; });
  });
  render(); G.toast('예시를 지웠어요');
}

/* ---------- 로그인 ---------- */
var AUTH_ERR = {
  'auth/invalid-email': '이메일 형식을 확인해 주세요.',
  'auth/missing-password': '비밀번호를 입력해 주세요.',
  'auth/weak-password': '비밀번호는 6자 이상이어야 해요.',
  'auth/email-already-in-use': '이미 가입된 이메일이에요. 로그인해 주세요.',
  'auth/user-not-found': '가입된 계정을 찾을 수 없어요.',
  'auth/wrong-password': '이메일 또는 비밀번호가 맞지 않아요.',
  'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요.',
  'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 해 주세요.',
  'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',
  'auth/popup-closed-by-user': '로그인 창이 닫혔어요.',
  'auth/cancelled-popup-request': '로그인 창이 닫혔어요.',
  'auth/operation-not-allowed': '이 로그인 방법은 아직 켜져 있지 않아요. Firebase 설정을 확인해 주세요.',
  'auth/unauthorized-domain': '이 주소가 Firebase 승인된 도메인에 없어요. 설정을 확인해 주세요.'
};
function authMsg(text, ok) { var m = $('#aMsg'); m.textContent = text || ''; m.classList.toggle('ok', !!ok); }
function authBusy(on) { ['aSubmit', 'aGoogle', 'aToggle', 'aReset'].forEach(function (id) { $('#' + id).disabled = on; }); }
function showAuth(on) {
  document.body.classList.toggle('authing', on);
  $('#auth').hidden = !on;
  $('#app').hidden = on;
  if (on) { $('#fab').hidden = true; $('#scrim').hidden = true; }
}
function setAuthMode(mode) {
  authMode = mode;
  var login = mode === 'login';
  $('#aSubmit').textContent = login ? '로그인' : '회원가입';
  $('#aToggle').textContent = login ? '계정이 없나요? 회원가입' : '이미 계정이 있나요? 로그인';
  $('#aReset').hidden = !login;
  $('#aPw').setAttribute('autocomplete', login ? 'current-password' : 'new-password');
  authMsg('');
}
async function submitAuth(e) {
  e.preventDefault();
  var email = $('#aEmail').value.trim(), pw = $('#aPw').value;
  if (!email || !pw) { authMsg('이메일과 비밀번호를 입력해 주세요.'); return; }
  authBusy(true); authMsg('');
  try {
    if (authMode === 'login') await G.fb.auth.signInWithEmailAndPassword(email, pw);
    else await G.fb.auth.createUserWithEmailAndPassword(email, pw);
  } catch (err) { authMsg(AUTH_ERR[err && err.code] || '처리하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  authBusy(false);
}
async function googleLogin() {
  var prov = new firebase.auth.GoogleAuthProvider();
  authBusy(true); authMsg('');
  try { await G.fb.auth.signInWithPopup(prov); }
  catch (err) {
    var c = err && err.code;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') {
      try { await G.fb.auth.signInWithRedirect(prov); return; } catch (e2) { err = e2; c = e2 && e2.code; }
    }
    authMsg(AUTH_ERR[c] || 'Google 로그인에 실패했어요.');
  }
  authBusy(false);
}
async function resetPw() {
  var email = $('#aEmail').value.trim();
  if (!email) { authMsg('위 칸에 이메일을 먼저 입력해 주세요.'); return; }
  authBusy(true);
  try { await G.fb.auth.sendPasswordResetEmail(email); authMsg('비밀번호 재설정 메일을 보냈어요. 메일함을 확인해 주세요.', true); }
  catch (err) { authMsg(AUTH_ERR[err && err.code] || '메일을 보내지 못했어요.'); }
  authBusy(false);
}
G.logout = async function () {
  try { await G.flush(); await G.fb.auth.signOut(); } catch (e) { G.toast('로그아웃하지 못했어요'); }
};

/* ---------- 로그인 후 데이터 불러오기 ---------- */
async function startSession() {
  var my = ++sessionSeq;
  showAuth(false);
  S.ready = false; S.tab = 'home';
  $('#loading').hidden = false; $('#loading').textContent = '불러오는 중…';
  render();
  try {
    var settings = await G.loadSettings();
    if (my !== sessionSeq) return;
    var first = !settings, imported = false;
    if (settings) G.applySettings(settings);
    else {
      imported = G.importLocal();
      if (!imported) G.seedDefaults();
      G.saveSettings();
    }
    G.watchSettings();
    await G.ensureMonth(S.month);
    if (my !== sessionSeq) return;
    if (first && !imported && !(S.tx[S.month] || []).length) G.seedSamples();
    S.ready = true;
    $('#loading').hidden = true;
    render();
  } catch (err) {
    var l = $('#loading');
    l.innerHTML = '데이터를 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br><button type="button" class="btn" id="retry" style="margin-top:12px">다시 시도</button>';
    $('#retry').addEventListener('click', function () { G.stopAll(); startSession(); });
  }
}

/* ---------- events ---------- */
function bind() {
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.dataset.tab); });
  });
  $('#prevM').addEventListener('click', function () { goMonth(G.shiftMonth(S.month, -1)); });
  $('#nextM').addEventListener('click', function () { goMonth(G.shiftMonth(S.month, 1)); });
  $('#fab').addEventListener('click', function () { openSheet(null); });
  $('#tab-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tx]'); if (!b) return;
    var arr = S.tx[S.month] || [];
    var t = arr.find(function (x) { return x.id === b.dataset.tx; });
    if (t) openSheet(t);
  });
  $('#tab-home').addEventListener('click', function (e) {
    if (e.target.id === 'clearSamples') clearSamples();
    var r = e.target.closest('[data-cat]'); if (r) G.openCat(r.dataset.cat);
  });
  $('#tab-home').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-cat]')) { e.preventDefault(); G.openCat(e.target.dataset.cat); }
  });
  $('#catClose').addEventListener('click', G.closeCat);
  $('#catScrim').addEventListener('click', function (e) { if (e.target.id === 'catScrim') G.closeCat(); });
  $('#txForm').addEventListener('submit', submitTx);
  $('#fCancel').addEventListener('click', closeSheet);
  $('#fDel').addEventListener('click', deleteTx);
  $('#fAmt').addEventListener('input', function (e) {
    var n = G.parseAmt(e.target.value); e.target.value = n ? G.numFmt(n) : '';
  });
  $('#scrim').addEventListener('click', function (e) { if (e.target.id === 'scrim') closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#scrim').hidden) closeSheet(); else if (!$('#catScrim').hidden) G.closeCat();
  });
  $('#aForm').addEventListener('submit', submitAuth);
  $('#aGoogle').addEventListener('click', googleLogin);
  $('#aToggle').addEventListener('click', function () { setAuthMode(authMode === 'login' ? 'signup' : 'login'); });
  $('#aReset').addEventListener('click', resetPw);
  $('#tab-my').addEventListener('click', function (e) {
    var b = e.target.closest('#logoutBtn'); if (b) onLogoutClick(b);
  });
  G.bindGoal();
  G.bindReview();
}

/* ---------- boot ---------- */
function boot() {
  bind();
  setAuthMode('login');
  if (!G.fbInit()) {
    showAuth(true);
    var noSdk = !window.firebase;
    $('#aForm').hidden = true; $('#aGoogle').hidden = true; $('.authlinks').hidden = true;
    authMsg(noSdk ? '로그인 모듈을 불러오지 못했어요. 인터넷에 연결한 뒤 새로고침해 주세요.' : 'Firebase 설정이 아직 없어요. firebase-config.js에 설정값을 넣어 주세요. (처음 한 번만 하면 돼요)');
    return;
  }
  showAuth(false);
  $('#loading').textContent = '로그인 확인 중…';
  G.fb.auth.onAuthStateChanged(function (user) {
    if (user) {
      G.fb.user = user;
      G.account = user.email || user.displayName || '로그인됨';
      startSession();
    } else {
      sessionSeq++;
      G.fb.user = null; G.account = '';
      G.stopAll();
      showAuth(true);
      setAuthMode('login');
      $('#aPw').value = '';
    }
  });
}
boot();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
